      storageClass: cityverse-local
    image:
      digest: sha256:62fb92d0111f8dc0565b7daf8a57279fd09520020b79fd3bc550deb3ae5aee70
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: '2'
        memory: 768Mi
    # Official chart's tini bootstrap, with its container image pinned.
    # Requires outbound Debian package access on a fresh deployment.
    initContainers:
      - name: install-tini
        image: debian:12-slim@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251
        command: [sh, -ec, "apt-get update && apt-get install -y --no-install-recommends tini && cp /usr/bin/tini /tmp/tini"]
        volumeMounts: [{name: tini-volume, mountPath: /tmp}]
