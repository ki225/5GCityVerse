apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gtp5g-installer
  namespace: kube-system
  labels:
    app.kubernetes.io/name: gtp5g-installer
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gtp5g-installer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gtp5g-installer
    spec:
      hostPID: true
      hostNetwork: true
      tolerations:
        - operator: Exists
      containers:
        - name: installer
          image: public.ecr.aws/amazonlinux/amazonlinux:2023
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          volumeMounts:
            - name: host-root
              mountPath: /host
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              dnf install -y util-linux
              nsenter -t 1 -m -u -i -n -p -- bash -lc '
                set -euo pipefail
                if lsmod | grep -q "^gtp5g"; then
                  echo "gtp5g already loaded"
                  exit 0
                fi
                PKG=dnf
                command -v dnf >/dev/null 2>&1 || PKG=yum
                $PKG install -y git gcc make kernel-devel-$(uname -r) elfutils-libelf-devel || $PKG install -y git gcc make kernel-devel elfutils-libelf-devel
                rm -rf /tmp/gtp5g
                git clone --depth 1 https://github.com/free5gc/gtp5g.git /tmp/gtp5g
                grep -RIl "flowi4_tos" /tmp/gtp5g/src | xargs -r sed -i "s/flowi4_tos/flowi4_dscp/g"
                make -C /tmp/gtp5g
                make -C /tmp/gtp5g install
                depmod -a
                modprobe gtp5g
                lsmod | grep "^gtp5g"
              '
              sleep infinity
      volumes:
        - name: host-root
          hostPath:
            path: /
