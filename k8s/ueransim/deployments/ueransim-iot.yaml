apiVersion: apps/v1
kind: Deployment
metadata:
  name: ueransim-iot
  namespace: free5gc
  labels:
    app: ueransim-iot
    app.kubernetes.io/component: ue
    app.kubernetes.io/part-of: 5gcityverse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ueransim-iot
  template:
    metadata:
      labels:
        app: ueransim-iot
        app.kubernetes.io/component: ue
        app.kubernetes.io/part-of: 5gcityverse
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ueransim-ue
          image: 429555954826.dkr.ecr.ap-northeast-1.amazonaws.com/5gcityverse-prod-ueransim@sha256:58909d22fe2b1d24893fe26eb9502dac1056c85e4135fa87902bf3a1d1eb3e0b
          imagePullPolicy: IfNotPresent
          command: ["./nr-ue"]
          args: ["-c", "/etc/ueransim/ue-config.yaml", "-n", "50"]
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN", "MKNOD"]
          volumeMounts:
            - name: ue-config
              mountPath: /etc/ueransim
              readOnly: true
            - name: dev-net-tun
              mountPath: /dev/net/tun
      volumes:
        - name: ue-config
          configMap:
            name: ueransim-ue-config-mmtc
            items:
              - key: ue-config.yaml
                path: ue-config.yaml
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
