apiVersion: batch/v1
kind: Job
metadata:
  name: iperf3-accident
  namespace: free5gc
  labels:
    app.kubernetes.io/component: iperf3
    app.kubernetes.io/part-of: 5gcityverse
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: iperf3-client
          image: networkstatic/iperf3:latest
          imagePullPolicy: IfNotPresent
          command: ["iperf3", "-c", "iperf3-server.free5gc.svc.cluster.local", "-u", "-b", "150M", "-t", "30", "-l", "1400", "--json"]
