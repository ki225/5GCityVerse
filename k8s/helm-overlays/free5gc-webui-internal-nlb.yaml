apiVersion: v1
kind: Service
metadata:
  name: free5gc-webui-private
  namespace: free5gc
  labels:
    app.kubernetes.io/name: free5gc-webui
    app.kubernetes.io/instance: free5gc
    app.kubernetes.io/component: private-webui-endpoint
  annotations:
    # Legacy/in-tree AWS Service controller, instance targets. Do not assume
    # AWS Load Balancer Controller or its security-group annotations.
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  loadBalancerSourceRanges:
    - 10.60.20.0/24
    - 10.60.21.0/24
  ports:
    - name: http
      protocol: TCP
      port: 5000
      targetPort: 5000
  selector:
    app.kubernetes.io/name: free5gc-webui
    app.kubernetes.io/instance: free5gc
    project: free5gc
    nf: webui
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: free5gc-webui-private-ingress
  namespace: free5gc
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: free5gc-webui
      app.kubernetes.io/instance: free5gc
      project: free5gc
      nf: webui
  policyTypes:
    - Ingress
  ingress:
    # Lambda ENIs, the internal NLB and EKS nodes use the tagged private
    # subnets. Lambda SG egress independently limits its calls to port 5000.
    - from:
        - ipBlock:
            cidr: 10.60.20.0/24
        - ipBlock:
            cidr: 10.60.21.0/24
      ports:
        - protocol: TCP
          port: 5000
    # Preserve legitimate in-namespace subscriber/profile administration.
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5000
