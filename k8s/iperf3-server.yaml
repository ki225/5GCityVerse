apiVersion: apps/v1
kind: Deployment
metadata:
  name: iperf3-server
  namespace: free5gc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iperf3-server
  template:
    metadata:
      labels:
        app: iperf3-server
    spec:
      containers:
        - name: iperf3
          image: networkstatic/iperf3:latest
          imagePullPolicy: IfNotPresent
          command: ["iperf3", "-s", "-p", "5201"]
          ports:
            - name: iperf3-tcp
              containerPort: 5201
              protocol: TCP
            - name: iperf3-udp
              containerPort: 5201
              protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: iperf3-server
  namespace: free5gc
spec:
  selector:
    app: iperf3-server
  clusterIP: None
  ports:
    - name: iperf3-tcp
      port: 5201
      targetPort: 5201
      protocol: TCP
    - name: iperf3-udp
      port: 5201
      targetPort: 5201
      protocol: UDP
