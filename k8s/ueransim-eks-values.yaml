global:
  free5gcReleaseName: free5gc
  gnb:
    multus:
      enabled: false

projectName: ueransim

gnb:
  enabled: true
  name: gnb
  replicaCount: 1
  image:
    name: 429555954826.dkr.ecr.ap-northeast-1.amazonaws.com/5gcityverse-prod-ueransim@sha256
    tag: 58909d22fe2b1d24893fe26eb9502dac1056c85e4135fa87902bf3a1d1eb3e0b
    pullPolicy: IfNotPresent
  amf:
    n2if:
      serviceName: free5gc-amf-amf-n2
      port: 38412
  configuration: |-
    mcc: '208'
    mnc: '93'
    nci: '0x000000010'
    idLength: 32
    tac: 1
    slices:
      - sst: 0x1
        sd: 0x000001
      - sst: 0x2
        sd: 0x000002
      - sst: 0x2
        sd: 0x000003
      - sst: 0x3
        sd: 0x000004
      - sst: 0x4
        sd: 0x000005
    ignoreStreamIds: true

ue:
  enabled: true
  name: ue
  replicaCount: 1
  image:
    name: 429555954826.dkr.ecr.ap-northeast-1.amazonaws.com/5gcityverse-prod-ueransim@sha256
    tag: 58909d22fe2b1d24893fe26eb9502dac1056c85e4135fa87902bf3a1d1eb3e0b
    pullPolicy: IfNotPresent
  command: "./nr-ue -c ./config/ue-config.yaml"
  podSecurityContext:
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
      add: ["NET_ADMIN", "MKNOD"]
  # This sidecar shares the resident UE Pod network namespace. It waits for
  # nr-ue to create uesimtun0, then binds every capped iperf run to that
  # interface. Unlike the former standalone EKS Job, this traffic can be
  # attributed to the resident free5GC bearer.
  baselineTraffic:
    enabled: true
    image: networkstatic/iperf3@sha256:c1e4a239a83d1d60975bce1c9b7661af5517e362bf335f66a2c5b6adaeb4f19f
    imagePullPolicy: IfNotPresent
    interface: uesimtun0
    server: iperf3-server.free5gc.svc.cluster.local
    # Keep the resident bearer observable without saturating the UE-TUN path.
    # Scenario workloads apply their own population-scaled rates separately.
    rate: 1M
    runSeconds: 180
    retrySeconds: 2
    packetLength: 800
    resources:
      requests:
        cpu: 25m
        memory: 16Mi
      limits:
        cpu: 250m
        memory: 64Mi
  configuration: |-
    supi: "imsi-208930000000001"
    mcc: "208"
    mnc: "93"
    key: "8baf473f2f8fd09487cccbd7097c6862"
    op: "8e27b6af0e692e750f32667a3b14605d"
    opType: "OPC"
    amf: "8000"
    imei: "356938035643803"
    imeiSv: "4370816125816151"
    uacAic:
      mps: false
      mcs: false
    uacAcc:
      normalClass: 0
      class11: false
      class12: false
      class13: false
      class14: false
      class15: false
    sessions:
      - type: "IPv4"
        apn: "citizen"
        slice:
          sst: 0x01
          sd: 0x000001
    configured-nssai:
      - sst: 0x01
        sd: 0x000001
    default-nssai:
      - sst: 1
        sd: 000001
    integrity:
      IA1: true
      IA2: true
      IA3: true
    ciphering:
      EA1: true
      EA2: true
      EA3: true
    integrityMaxRate:
      uplink: "full"
      downlink: "full"
