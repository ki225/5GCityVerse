global:
  userPlaneArchitecture: single
  uesubnet: 10.100.0.0/16
  # EKS managed nodes do not expose a stable, unmanaged eth1 for free5GC
  # Multus ipvlan attachments. Keep chart-level Multus disabled unless the
  # node bootstrap path also provisions dedicated host ENIs for N2/N3/N4/N6.
  # UERANSIM reaches AMF through the chart's NGAP NodePort service instead.
  amf:
    multus:
      enabled: false
      n2if:
        ipAddress: 10.60.12.100   # AMF N2 (NGAP/SCTP toward gNB)
      n2network:
        enabled: true
        name: n2network
        type: ipvlan               # ipvlan required for AWS VPC ENI compatibility
        masterIf: eth1
        subnetIP: "10.60.12.0"
        cidrBlock: 24
        gatewayIP: "10.60.12.1"
        excludeIP: "10.60.12.254"
  upf:
    multus:
      enabled: false
      upf:
        n3if:
          ipAddress: 10.60.10.100  # UPF N3 (GTP-U from gNB)
        n4if:
          ipAddress: 10.60.11.100  # UPF N4 (PFCP from SMF)
        n6if:
          ipAddress: 10.60.13.100  # UPF N6 (egress to Data Network / internet)
      n3network:
        name: n3network
        type: ipvlan
        masterIf: eth1
        subnetIP: "10.60.10.0"
        cidrBlock: 24
        gatewayIP: "10.60.10.1"
        excludeIP: "10.60.10.254"
      n4network:
        name: n4network
        type: ipvlan
        masterIf: eth1
        subnetIP: "10.60.11.0"
        cidrBlock: 24
        gatewayIP: "10.60.11.1"
        excludeIP: "10.60.11.254"
      n6network:
        name: n6network
        type: ipvlan
        masterIf: eth1
        subnetIP: "10.60.13.0"
        cidrBlock: 24
        gatewayIP: "10.60.13.1"
        excludeIP: "10.60.13.254"
  # ───────────────────────────────────────────────────────────────────────────
free5gc-upf:
  global:
    userPlaneArchitecture: single
    uesubnet: 10.100.0.0/16
  upf:
    # Schedule UPF exclusively on user-plane nodes. Multus annotations stay
    # disabled for EKS managed nodes because there is no stable host eth1.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: plane
                  operator: In
                  values:
                    - user-plane
    tolerations:
      - key: plane
        operator: Equal
        value: user-plane
        effect: NoSchedule
    # ────────────────────────────────────────────────────────────────────────────
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      sysctls: []
    securityContext:
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
        add:
          - NET_ADMIN
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1024Mi
    configuration:
      dnnList:
        - dnn: internet
          cidr: 10.100.1.0/24
        - dnn: internet
          cidr: 10.100.2.0/24
        - dnn: emergency
          cidr: 10.100.3.0/24
        - dnn: iot
          cidr: 10.100.40.0/20
        - dnn: internet
          cidr: 10.100.5.0/24
      logger:
        enable: true
        level: trace
        reportCaller: false
free5gc-amf:
  amf:
    # Schedule AMF on control-plane nodes. UERANSIM connects through the AMF
    # NGAP NodePort service instead of a Multus N2 interface.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: plane
                  operator: In
                  values:
                    - control-plane
    # ────────────────────────────────────────────────────────────────────────────
    configuration:
      configuration: |-
        amfName: AMF
        serviceNameList:
          - namf-comm
          - namf-evts
          - namf-mt
          - namf-loc
          - namf-oam
        servedGuamiList:
          - plmnId:
              mcc: 208
              mnc: 93
            amfId: cafe00
        supportTaiList:
          - plmnId:
              mcc: 208
              mnc: 93
            tac: 000001
        plmnSupportList:
          - plmnId:
              mcc: 208
              mnc: 93
            snssaiList:
              - sst: 1
                sd: 000001
              - sst: 2
                sd: 000002
              - sst: 2
                sd: 000003
              - sst: 3
                sd: 000004
              - sst: 4
                sd: 000005
        supportDnnList:
          - citizen
          - emergency
          - iot
          - v2x
        security:
          integrityOrder:
            - NIA2
          cipheringOrder:
            - NEA0
        networkName:
          full: free5GC
          short: free
        ngapIE:
          mobilityRestrictionList:
            enable: true
          maskedIMEISV:
            enable: true
          redirectionVoiceFallback:
            enable: false
        nasIE:
          networkFeatureSupport5GS:
            enable: true
            length: 1
            imsVoPS: 0
            emc: 0
            emf: 0
            iwkN26: 0
            mpsi: 0
            emcN3: 0
            mcsi: 0
        t3502Value: 720
        t3512Value: 3600
        non3gppDeregTimerValue: 3240
        t3513:
          enable: true
          expireTime: 6s
          maxRetryTimes: 4
        t3522:
          enable: true
          expireTime: 6s
          maxRetryTimes: 4
        t3550:
          enable: true
          expireTime: 6s
          maxRetryTimes: 4
        t3555:
          enable: true
          expireTime: 6s
          maxRetryTimes: 4
        t3560:
          enable: true
          expireTime: 6s
          maxRetryTimes: 4
        t3565:
          enable: true
          expireTime: 6s
          maxRetryTimes: 4
        t3570:
          enable: true
          expireTime: 6s
          maxRetryTimes: 4
        locality: area1
        sctp:
          numOstreams: 3
          maxInstreams: 5
          maxAttempts: 2
          maxInitTimeout: 2
        defaultUECtxReq: false
free5gc-nssf:
  nssf:
    configuration:
      configuration: |-
        nssfName: NSSF
        supportedPlmnList:
          - mcc: 208
            mnc: 93
        supportedNssaiInPlmnList:
          - plmnId:
              mcc: 208
              mnc: 93
            supportedSnssaiList:
              - sst: 1
                sd: 000001
              - sst: 2
                sd: 000002
              - sst: 2
                sd: 000003
              - sst: 3
                sd: 000004
              - sst: 4
                sd: 000005
        amfList:
          - nfId: ffa2e8d7-3275-49c7-8631-6af1df1d9d26
            supportedNssaiAvailabilityData:
              - tai:
                  plmnId:
                    mcc: 208
                    mnc: 93
                  tac: 000001
                supportedSnssaiList:
                  - sst: 1
                    sd: 000001
                  - sst: 2
                    sd: 000002
                  - sst: 2
                    sd: 000003
                  - sst: 3
                    sd: 000004
                  - sst: 4
                    sd: 000005
        taList:
          - tai:
              plmnId:
                mcc: 208
                mnc: 93
              tac: 000001
            accessType: 3GPP_ACCESS
            supportedSnssaiList:
              - sst: 1
                sd: 000001
              - sst: 2
                sd: 000002
              - sst: 2
                sd: 000003
              - sst: 3
                sd: 000004
              - sst: 4
                sd: 000005
free5gc-smf:
  global:
    userPlaneArchitecture: single
  smf:
    # ── CP/UP Separation: schedule SMF exclusively on control-plane nodes ───────
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: plane
                  operator: In
                  values:
                    - control-plane
    # ────────────────────────────────────────────────────────────────────────────
    configuration:
      configuration: |-
        smfName: SMF
        snssaiInfos:
          - sNssai:
              sst: 1
              sd: 000001
            dnnInfos:
              - dnn: internet
                dns:
                  ipv4: 8.8.8.8
                  ipv6: 2001:4860:4860::8888
          - sNssai:
              sst: 2
              sd: 000002
            dnnInfos:
              - dnn: internet
                dns:
                  ipv4: 8.8.8.8
                  ipv6: 2001:4860:4860::8888
          - sNssai:
              sst: 2
              sd: 000003
            dnnInfos:
              - dnn: internet
                dns:
                  ipv4: 8.8.8.8
                  ipv6: 2001:4860:4860::8888
          - sNssai:
              sst: 3
              sd: 000004
            dnnInfos:
              - dnn: internet
                dns:
                  ipv4: 8.8.8.8
                  ipv6: 2001:4860:4860::8888
          - sNssai:
              sst: 4
              sd: 000005
            dnnInfos:
              - dnn: internet
                dns:
                  ipv4: 8.8.8.8
                  ipv6: 2001:4860:4860::8888
        plmnList:
          - mcc: 208
            mnc: 93
        userplaneInformation:
          upNodes:
            gNB1:
              type: AN
            UPF:
              type: UPF
              nodeID: UPF_SERVICE_NAME
              sNssaiUpfInfos:
                - sNssai:
                    sst: 1
                    sd: 000001
                  dnnUpfInfoList:
                    - dnn: internet
                      pools:
                        - cidr: 10.100.1.0/24
                - sNssai:
                    sst: 2
                    sd: 000002
                  dnnUpfInfoList:
                    - dnn: internet
                      pools:
                        - cidr: 10.100.2.0/24
                - sNssai:
                    sst: 2
                    sd: 000003
                  dnnUpfInfoList:
                    - dnn: internet
                      pools:
                        - cidr: 10.100.3.0/24
                - sNssai:
                    sst: 3
                    sd: 000004
                  dnnUpfInfoList:
                    - dnn: internet
                      pools:
                        - cidr: 10.100.40.0/20
                - sNssai:
                    sst: 4
                    sd: 000005
                  dnnUpfInfoList:
                    - dnn: internet
                      pools:
                        - cidr: 10.100.5.0/24
              interfaces:
                - interfaceType: N3
                  endpoints:
                    - UPF_SERVICE_NAME
                  networkInstances:
                    - internet
                    - emergency
                    - iot
          links:
            - A: gNB1
              B: UPF
        locality: area1
        t3591:
          enable: true
          expireTime: 16s
          maxRetryTimes: 3
        t3592:
          enable: true
          expireTime: 16s
          maxRetryTimes: 3
      ueRoutingInfo: |-
        UE1:
          members:
            - imsi-208930000000001
          topology:
            - A: gNB1
              B: UPF
free5gc-webui:
  webui:
    # ── CP/UP Separation: schedule WebUI on control-plane nodes ─────────────────
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: plane
                  operator: In
                  values:
                    - control-plane
    # ────────────────────────────────────────────────────────────────────────────
    service:
      # Keep the chart-owned service off the public load-balancer path. A
      # repository-owned internal NLB overlay is the only Lambda endpoint.
      type: NodePort
      port: 5000
      nodePort: 30500
mongodb:
  extraDeploy: []
  persistence:
    enabled: false
